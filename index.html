<!DOCTYPE html><html lang='cs'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Servis Vozidel</title>
<style>
body{margin:0;font-family:Segoe UI,sans-serif;background:#f4f6fb;color:#111;padding-bottom:75px}.dark{background:#111827;color:#fff}.top{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:14px}.card{background:#fff;margin:10px;padding:12px;border-radius:12px}.dark .card{background:#1f2937;color:#fff}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff}.dark .nav{background:#1f2937}.nav button{flex:1;border:0;background:transparent;font-size:22px;padding:12px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{text-align:center;border:1px solid #ddd;border-radius:8px;min-height:60px;padding:4px;cursor:pointer}.today{border:2px solid #2563eb}.btn{background:#2563eb;color:#fff;border:0;padding:8px 12px;border-radius:8px}input,textarea,select{width:100%;padding:8px;margin:4px 0;box-sizing:border-box}.red{color:#dc2626}.orange{color:#ea580c}.yellow{color:#ca8a04}.green{color:#16a34a}
</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2563eb"></head><body>
<div class='top'><h2>🛠 Servis Vozidel</h2></div>
<div id='calendarView'><div id='cal'></div><div id='dayDetail'></div></div>
<div id='cars' class='hidden'><div class='card'><input id='search' placeholder='Hledat'></div><div id='carlist'></div></div>
<div id='add' class='hidden'><div class='card'>
<input id='spz' placeholder='SPZ'><input id='znacka' placeholder='Značka'><input id='majitel' placeholder='Majitel'><input id='telefon' placeholder='Telefon'>
<input id='termin' type='date'><input id='zavada' placeholder='Závada'>
<select id='stav'><option>Otevřeno</option><option>Čeká na díly</option><option>V opravě</option><option>Hotovo</option></select>
<button class='btn' onclick='saveRepair()'>Uložit opravu</button></div></div>
<div id='settings' class='hidden'><div class='card'><button class='btn' onclick='toggleDark()'>Tmavý režim</button><br><br><button class='btn' onclick='exportData()'>Export</button><br><br><input type='file' onchange='importData(event)'></div></div>
<div class='nav'><button onclick="view('calendar')">📅</button><button onclick="view('cars')">☰</button><button onclick="view('add')">➕</button><button onclick="view('settings')">⚙</button></div>
<script>
let db=JSON.parse(localStorage.getItem('servisV12')||'[]');let current=new Date();
const cal=document.getElementById('cal'),dayDetail=document.getElementById('dayDetail'),carlist=document.getElementById('carlist');
if(localStorage.dark==='1')document.body.classList.add('dark');
function persist(){localStorage.setItem('servisV12',JSON.stringify(db));renderCalendar();renderCars();}
function view(v){['calendarView','cars','add','settings'].forEach(id=>document.getElementById(id).classList.add('hidden'));if(v==='calendar')document.getElementById('calendarView').classList.remove('hidden');else document.getElementById(v).classList.remove('hidden');}
function saveRepair(){if(!spz.value||!termin.value)return alert('Vyplň SPZ a termín');let r={termin:termin.value,zavada:zavada.value,stav:stav.value};let c=db.find(x=>x.spz===spz.value);if(c){c.opravy.push(r);}else{db.push({spz:spz.value,znacka:znacka.value,majitel:majitel.value,telefon:telefon.value,opravy:[r]});}persist();alert('Uloženo');}
function pr(ds,reps){if(!reps.length)return'';let t=new Date().toISOString().slice(0,10);if(ds<=t&&reps.some(x=>x.stav!='Hotovo'))return'red';if(reps.some(x=>x.stav=='Čeká na díly'))return'orange';if(reps.some(x=>x.stav=='V opravě'))return'yellow';return'green';}
function renderCalendar(){let y=current.getFullYear(),m=current.getMonth(),f=new Date(y,m,1),l=new Date(y,m+1,0);let s=(f.getDay()+6)%7;let h=`<div class='card'><div style='display:flex;justify-content:space-between'><button class='btn' onclick='chg(-1)'>◀</button><b>${new Date(y,m).toLocaleDateString('cs-CZ',{month:'long',year:'numeric'})}</b><button class='btn' onclick='chg(1)'>▶</button></div><div class='grid'><div>Po</div><div>Út</div><div>St</div><div>Čt</div><div>Pá</div><div>So</div><div>Ne</div>`;for(let i=0;i<s;i++)h+='<div></div>';for(let d=1;d<=l.getDate();d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let reps=[];db.forEach(v=>v.opravy.forEach(o=>{if(o.termin===ds)reps.push(o)}));h+=`<div class='day' onclick="showDay('${ds}')"><div>${d}</div><div class='${pr(ds,reps)}'>${'•'.repeat(Math.min(reps.length,4))}</div></div>`;}cal.innerHTML=h+'</div></div>';}
function showDay(ds){let out=[];db.forEach(v=>v.opravy.forEach(o=>{if(o.termin===ds)out.push(`<b>${v.znacka||'-'} ${v.spz}</b><br>${o.zavada}<br>Stav: ${o.stav}`)}));dayDetail.innerHTML=`<div class='card'><h3>${ds}</h3>${out.join('<hr>')||'Žádné opravy'}</div>`;}
function renderCars(){let q=(search.value||'').toLowerCase();carlist.innerHTML=db.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>`<div class='card'><b>${x.znacka}</b> (${x.spz})<br>Počet oprav: ${x.opravy.length}</div>`).join('');}
search.oninput=renderCars;function chg(n){current.setMonth(current.getMonth()+n);renderCalendar();}
function toggleDark(){document.body.classList.toggle('dark');localStorage.dark=document.body.classList.contains('dark')?'1':'0';}
function exportData(){let a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(db));a.download='servis-vozidel.json';a.click();}
function importData(e){let r=new FileReader();r.onload=()=>{db=JSON.parse(r.result);persist();};r.readAsText(e.target.files[0]);}
renderCalendar();renderCars();showDay(new Date().toISOString().slice(0,10));
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script></body></html>
